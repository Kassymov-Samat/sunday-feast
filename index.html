<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Воскресный пир — меню и закуп</title>
<meta name="description" content="Меню и список закупа: повар выбирает блюда и число гостей, закупщик правит цены, список уходит в Google Docs">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪷</text></svg>">
<style>
  :root {
    --bg: #faf7f2; --card: #fff; --text: #2a2420; --muted: #8a7f76; --line: #ece5dc; --soft: #f6f1ea;
    --accent: #c2562b; --accent-soft: #fbe9df; --ok: #2f8f5b; --warn: #a86a00; --warn-soft: #fff3d6; --off: #b9b0a7;
    --shadow: 0 1px 2px rgba(60,40,20,.06), 0 4px 16px rgba(60,40,20,.05); --r: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1815; --card: #24201c; --text: #f1ebe4; --muted: #a59a8f; --line: #38312b; --soft: #2c2722;
      --accent: #e8794a; --accent-soft: #3a261c; --ok: #5cc28a; --warn: #f0b44a; --warn-soft: #3a2f17; --off: #6b625a;
      --shadow: 0 1px 2px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 80px; }
  input, select, button, textarea { font: inherit; color: inherit; }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  h1 { font-size: 26px; margin: 0; letter-spacing: -.01em; }
  .meta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .field { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; box-shadow: var(--shadow); }
  .field label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .field input { border: none; background: transparent; outline: none; }
  #guests { width: 64px; font-size: 18px; font-weight: 700; text-align: center; }
  #eventName { width: 210px; }
  .step { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--soft); cursor: pointer; }
  .icon-btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; width: 40px; height: 40px; cursor: pointer; box-shadow: var(--shadow); }
  .grid { display: grid; grid-template-columns: 380px 1fr; gap: 18px; align-items: start; }
  .grid > * { min-width: 0; }
  @media (max-width: 920px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; }
  .card + .card { margin-top: 16px; }
  h2 { font-size: 16px; margin: 0 0 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  h2 small { color: var(--muted); font-weight: 500; font-size: 12.5px; }
  .search { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--soft); outline: none; margin-bottom: 8px; }
  .search:focus { border-color: var(--accent); }
  .cats { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .cat { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
  .cat.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .dlist { max-height: 62vh; overflow: auto; margin: 0 -6px; padding: 0 6px; }
  @media (max-width: 920px) { .dlist { max-height: 46vh; } }
  .dgroup { font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 10px 0 4px; }
  .dish { display: flex; gap: 10px; align-items: flex-start; padding: 8px; border-radius: 10px; cursor: pointer; }
  .dish:hover { background: var(--soft); }
  .dish.on { background: var(--accent-soft); }
  .dish input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); flex: none; }
  .dish .nm { font-weight: 600; }
  .dish .sub { font-size: 12px; color: var(--muted); }
  .tag { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 0 6px; border-radius: 999px; background: var(--soft); color: var(--muted); margin-left: 4px; vertical-align: 1px; }
  .chosen { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-soft); color: var(--text); border-radius: 999px; padding: 3px 4px 3px 10px; font-size: 13px; }
  .chip button { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 15px; width: 22px; height: 22px; border-radius: 50%; }
  .chip button:hover { color: var(--accent); }
  .empty { color: var(--muted); font-size: 13.5px; padding: 6px 0; }
  .totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
  .tot { background: var(--card); padding: 10px 12px; }
  .tot span { display: block; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .tot b { font-size: 18px; font-variant-numeric: tabular-nums; }
  .tot.main { background: var(--accent-soft); }
  .tot.main b { color: var(--accent); font-size: 22px; }
  .sec h2 .stot { font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  td.chk { width: 28px; } td.chk input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
  .pn { font-weight: 600; }
  .uses { font-size: 12px; color: var(--muted); }
  .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .qin, .pin { width: 82px; text-align: right; padding: 5px 7px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); outline: none; }
  .qin:focus, .pin:focus { border-color: var(--accent); background: var(--card); }
  .qin.edited, .pin.edited { border-color: var(--accent); background: var(--accent-soft); }
  .unit { color: var(--muted); font-size: 13px; padding-left: 4px; }
  .src { display: block; font-size: 10.5px; color: var(--muted); text-align: right; }
  .src.old { color: var(--warn); font-weight: 700; }
  .reset { border: none; background: transparent; color: var(--accent); cursor: pointer; font-size: 13px; padding: 0 2px; }
  tr.off td { color: var(--off); } tr.off .pn { text-decoration: line-through; } tr.off input.qin, tr.off input.pin { opacity: .5; }
  .addrow { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .addrow select, .addrow input { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); min-width: 0; }
  .addrow select { flex: 1 1 200px; }
  .btn { border: none; border-radius: 10px; padding: 10px 16px; font-weight: 700; cursor: pointer; background: var(--accent); color: #fff; }
  .btn.small { padding: 6px 12px; font-size: 13px; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  .btn:disabled { opacity: .6; cursor: wait; }
  .actions { position: sticky; bottom: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(6px); padding: 10px 0; margin-top: 12px; }
  .actions .grow { flex: 1; }
  .hint { font-size: 12.5px; color: var(--muted); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 90px); background: var(--text); color: var(--bg);
    padding: 10px 18px; border-radius: 999px; font-weight: 600; transition: transform .25s; z-index: 20; max-width: 92vw; }
  .toast.show { transform: translate(-50%, 0); }
  dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--text); max-width: 520px; width: 92vw; padding: 20px; }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog input { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--soft); margin: 6px 0 12px; }
  .doclink { display: block; margin-top: 8px; font-weight: 700; color: var(--accent); word-break: break-all; }
  @media (max-width: 560px) {
    #eventName { width: 150px; }
    .hide-sm { display: none; }
    .qin, .pin { width: 64px; }
    td, th { padding: 5px 3px; }
  }
  @media print {
    header .icon-btn, .actions, .addrow, td.chk, .search, .cats, aside { display: none !important; }
    .grid { grid-template-columns: 1fr; }
    tr.off { display: none; }
    .card { box-shadow: none; }
    input.qin, input.pin { border: none; background: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🪷 Воскресный пир</h1>
    <div class="meta">
      <div class="field"><label for="eventName">Событие</label><input id="eventName" placeholder="Воскресный пир 26.10"></div>
      <div class="field">
        <label for="guests">Гостей</label>
        <button class="step" id="minus" aria-label="Меньше гостей">−</button>
        <input id="guests" type="number" min="1" max="2000" inputmode="numeric">
        <button class="step" id="plus" aria-label="Больше гостей">+</button>
      </div>
      <button class="icon-btn" id="settingsBtn" title="Настройки" aria-label="Настройки">⚙</button>
    </div>
  </header>

  <div class="grid">
    <aside>
      <section class="card">
        <h2>Блюда <small id="dishCount"></small></h2>
        <div class="chosen" id="chosen"></div>
      </section>
      <section class="card">
        <h2>Справочник блюд <small id="refCount"></small></h2>
        <input class="search" id="search" type="search" placeholder="Найти блюдо или продукт…" aria-label="Поиск блюда">
        <div class="cats" id="cats"></div>
        <div class="dlist" id="dlist"></div>
      </section>
    </aside>

    <main>
      <div class="totals" id="totals"></div>
      <div id="sections"></div>
      <div class="actions">
        <button class="btn" id="docsBtn">📄 Отправить в Google Docs</button>
        <button class="btn ghost" id="copyDocBtn" title="Скопировать таблицы и вставить в Google Docs вручную">Скопировать для Docs</button>
        <button class="btn ghost" id="copyTextBtn">Текстом (WhatsApp)</button>
        <span class="grow"></span>
        <button class="btn ghost small" id="printBtn">Печать</button>
        <button class="btn ghost small" id="resetBtn">Сбросить</button>
      </div>
      <p class="hint">Количество посчитано на число гостей по раскладке майского ретрита. Любую цифру можно исправить —
        исправленные поля подсвечены, ↺ возвращает расчёт. Цены с пометкой <b style="color:var(--warn)">май</b> — устаревшие, их стоит уточнить.</p>
    </main>
  </div>
</div>

<dialog id="settings">
  <h2 style="margin-top:0">Настройки</h2>
  <label class="hint" for="webappUrl">Адрес скрипта Google Docs (веб-приложение Apps Script, …/exec)</label>
  <input id="webappUrl" placeholder="https://script.google.com/macros/s/…/exec">
  <label class="hint" for="cookName">Повар (будет в документе)</label>
  <input id="cookName" placeholder="Имя повара">
  <div style="display:flex; gap:8px; justify-content:flex-end">
    <button class="btn ghost small" id="settingsCancel">Закрыть</button>
    <button class="btn small" id="settingsSave">Сохранить</button>
  </div>
</dialog>

<dialog id="docDialog">
  <h2 style="margin-top:0">Документ</h2>
  <div id="docMsg"></div>
  <div style="display:flex; justify-content:flex-end; margin-top:14px"><button class="btn small" id="docClose">Готово</button></div>
</dialog>

<div class="toast" id="toast"></div>

<script src="data/config.js"></script>
<script src="data/catalog.js"></script>
<script src="data/dishes.js"></script>
<script>
(function () {
  const CAT = window.CATALOG || {};
  const DISHES = window.DISHES || [];
  const CFG = window.CONFIG || {};
  const byId = Object.fromEntries(DISHES.map(d => [d.id, d]));
  const $ = (id) => document.getElementById(id);
  const KEY = "sunday-feast-v2";
  // Разделы на сайте → вкладки Google Docs
  const SECTIONS = [
    { name: "Молочка", tab: "Молочка", icon: "🥛" },
    { name: "Бакалея", tab: "Бакалея", icon: "🌾" },
    { name: "Овощи и фрукты", tab: "Овощи и фрукты", icon: "🥕" },
    { name: "Специи", tab: "Бакалея", icon: "🧂" },
    { name: "Остальное", tab: "Остальное", icon: "📦" },
    { name: "Хоз. часть", tab: "Остальное", icon: "🧽" },
  ];

  // ── состояние ──
  const fresh = () => ({ event: "", guests: CFG.DEFAULT_GUESTS || 50, dishes: [], edits: {}, extra: [], extraKeys: [], webapp: "", cook: "" });
  let S = fresh();
  try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  if (location.hash.length > 1) {
    const h = new URLSearchParams(location.hash.slice(1));
    if (h.get("d")) S.dishes = h.get("d").split(",").filter(id => byId[id]);
    if (h.get("g")) S.guests = Math.max(1, +h.get("g") || S.guests);
    if (h.get("e")) S.event = h.get("e");
  }
  S.dishes = S.dishes.filter(id => byId[id]);
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const money = (n) => Math.round(n || 0).toLocaleString("ru-RU") + " ₸";
  const toast = (m) => { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2200); };

  // ── расчёт количества ──
  function roundQty(q, unit) {
    if (q <= 0) return 0;
    if (["шт", "пачка", "банка", "рулон", "м"].includes(unit)) return Math.ceil(q - 1e-9);
    return q < 1 ? Math.max(0.05, Math.ceil(q * 20) / 20) : Math.round(q * 10) / 10;  // кг/л: до 50 г, затем до 100 г
  }
  const fmtQty = (q) => (Math.round(q * 100) / 100).toLocaleString("ru-RU");

  function computeRows() {
    const rows = {};
    const g = S.guests;
    const add = (key, q, dishName) => {
      const r = rows[key] || (rows[key] = { key, q: 0, uses: [] });
      r.q += q;
      if (dishName && !r.uses.includes(dishName)) r.uses.push(dishName);
    };
    for (const id of S.dishes) {
      const d = byId[id];
      for (const [k, q] of Object.entries(d.products || {})) add(k, q * g, d.name);
      for (const [k, q] of Object.entries(d.spices || {})) add(k, q * g, d.name);
    }
    // специи: базовый набор по норме ретрита (упаковок на 100 гостей за приём пищи);
    // пачками — минимум 1 упаковка, весовые (барбарис, паприка) — по расчёту
    for (const [k, c] of Object.entries(CAT)) {
      if (c.section === "Специи" && (c.default || rows[k])) {
        const base = (c.per100 || 0) * g / 100;
        const r = rows[k] || (rows[k] = { key: k, q: 0, uses: [] });
        r.q = Math.max(r.q, base, c.unit === "кг" ? 0 : 1);
      }
      if (c.section === "Хоз. часть" && c.default) add(k, c.per_guest ? c.per_guest * g : 1, null);
    }
    const list = Object.values(rows).map(r => {
      const c = CAT[r.key] || {};
      const e = S.edits[r.key] || {};
      const calc = roundQty(r.q, c.unit);
      const qty = e.qty != null ? e.qty : calc;
      const price = e.price != null ? e.price : (c.price || 0);
      return { ...r, ...c, calc, qty, price, sum: qty * price, off: !!e.off, qtyEdited: e.qty != null, priceEdited: e.price != null };
    });
    // позиции, добавленные из справочника вручную
    for (const k of S.extraKeys || []) {
      if (list.some(r => r.key === k) || !CAT[k]) continue;
      const c = CAT[k], e = S.edits[k] || {};
      const qty = e.qty != null ? e.qty : 1, price = e.price != null ? e.price : (c.price || 0);
      list.push({ key: k, ...c, uses: ["добавлено вручную"], calc: 1, qty, price, sum: qty * price, off: !!e.off,
                  qtyEdited: false, priceEdited: e.price != null });
    }
    // свои позиции (не из справочника)
    for (const x of S.extra) {
      const e = S.edits[x.id] || {};
      list.push({ key: x.id, name: x.name, unit: x.unit, section: x.section, calc: x.qty, qty: e.qty != null ? e.qty : x.qty,
                  price: e.price != null ? e.price : x.price, uses: ["добавлено вручную"], extra: true, off: !!e.off,
                  qtyEdited: e.qty != null, priceEdited: e.price != null, price_src: "" });
      const it = list[list.length - 1]; it.sum = it.qty * it.price;
    }
    return list;
  }

  // ── отрисовка: блюда ──
  let catFilter = "Все";
  function renderDishes() {
    $("refCount").textContent = DISHES.length + " блюд";
    const cats = ["Все", ...new Set(DISHES.map(d => d.category))];
    $("cats").innerHTML = cats.map(c => `<button class="cat ${c === catFilter ? "on" : ""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
    const q = $("search").value.trim().toLowerCase();
    const match = (d) => (catFilter === "Все" || d.category === catFilter) &&
      (!q || d.name.toLowerCase().includes(q) || Object.keys(d.products).some(k => (CAT[k]?.name || "").toLowerCase().includes(q)));
    const groups = {};
    DISHES.filter(match).forEach(d => (groups[d.category] ||= []).push(d));
    $("dlist").innerHTML = Object.keys(groups).length ? Object.entries(groups).map(([cat, ds]) => `
      <div class="dgroup">${esc(cat)}</div>
      ${ds.map(d => {
        const on = S.dishes.includes(d.id);
        const comp = Object.keys(d.products).map(k => CAT[k]?.name).filter(Boolean).slice(0, 6).join(", ");
        return `<label class="dish ${on ? "on" : ""}">
          <input type="checkbox" data-dish="${d.id}" ${on ? "checked" : ""}>
          <span><span class="nm">${esc(d.name)}</span>${(d.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}
            <div class="sub">${esc(comp)}${Object.keys(d.products).length > 6 ? "…" : ""}</div></span>
        </label>`;
      }).join("")}`).join("") : `<div class="empty">Ничего не найдено</div>`;
    $("chosen").innerHTML = S.dishes.length
      ? S.dishes.map(id => `<span class="chip">${esc(byId[id].name)}<button data-undish="${id}" aria-label="Убрать ${esc(byId[id].name)}">✕</button></span>`).join("")
      : `<div class="empty">Отметьте блюда в справочнике ниже — список закупа соберётся сам.</div>`;
    $("dishCount").textContent = S.dishes.length ? S.dishes.length + " выбрано" : "";
  }

  // ── отрисовка: список закупа ──
  function rowHtml(r) {
    const old = r.price_src && r.price_src.startsWith("май");
    const src = r.priceEdited ? "исправлено" : (r.price_src || "");
    return `<tr class="${r.off ? "off" : ""}">
      <td class="chk"><input type="checkbox" data-off="${r.key}" ${r.off ? "" : "checked"} aria-label="Покупать: ${esc(r.name)}"></td>
      <td><div class="pn">${esc(r.name)}</div><div class="uses">${esc((r.uses || []).join(", "))}</div></td>
      <td class="num"><input class="qin ${r.qtyEdited ? "edited" : ""}" data-qty="${r.key}" value="${fmtQty(r.qty)}" inputmode="decimal" aria-label="Количество">
        <span class="unit">${esc(r.unit || "")}</span>${r.qtyEdited ? `<button class="reset" data-resetq="${r.key}" title="Вернуть расчёт: ${fmtQty(r.calc)}">↺</button>` : ""}</td>
      <td class="num hide-sm"><input class="pin ${r.priceEdited ? "edited" : ""}" data-price="${r.key}" value="${Math.round(r.price || 0)}" inputmode="decimal" aria-label="Цена за единицу">
        <span class="src ${old && !r.priceEdited ? "old" : ""}">${esc(src)}${r.priceEdited ? ` <button class="reset" data-resetp="${r.key}" title="Вернуть цену">↺</button>` : ""}</span></td>
      <td class="num"><b>${money(r.sum)}</b></td>
    </tr>`;
  }

  function render() {
    $("guests").value = S.guests;
    $("eventName").value = S.event;
    renderDishes();
    const rows = computeRows();
    let grand = 0;
    const totals = [];
    $("sections").innerHTML = SECTIONS.map(sec => {
      const rs = rows.filter(r => r.section === sec.name).sort((a, b) => b.sum - a.sum);
      const tot = rs.filter(r => !r.off).reduce((s, r) => s + r.sum, 0);
      grand += tot; totals.push([sec, tot]);
      const options = Object.entries(CAT).filter(([k, c]) => c.section === sec.name && !rs.some(r => r.key === k))
        .sort((a, b) => a[1].name.localeCompare(b[1].name, "ru"))
        .map(([k, c]) => `<option value="${k}">${esc(c.name)}</option>`).join("");
      return `<section class="card sec" id="sec-${sec.name}">
        <h2>${sec.icon} ${esc(sec.name)} <small class="stot">${rs.filter(r => !r.off).length} поз. · <b>${money(tot)}</b></small></h2>
        ${rs.length ? `<table><thead><tr><th></th><th>Наименование</th><th class="num">Кол-во</th><th class="num hide-sm">Цена за ед.</th><th class="num">Сумма</th></tr></thead>
          <tbody>${rs.map(rowHtml).join("")}</tbody></table>` : `<div class="empty">Пока пусто</div>`}
        <div class="addrow">
          <select data-addsel="${esc(sec.name)}"><option value="">+ добавить из справочника…</option>${options}<option value="__custom">+ своя позиция…</option></select>
        </div>
      </section>`;
    }).join("");
    $("totals").innerHTML = totals.map(([s, t]) => `<div class="tot"><span>${s.icon} ${esc(s.name)}</span><b>${money(t)}</b></div>`).join("")
      + `<div class="tot main"><span>Итого · на гостя ${money(grand / Math.max(1, S.guests))}</span><b>${money(grand)}</b></div>`;
    save();
  }

  // ── события ──
  const setGuests = (n) => { S.guests = Math.max(1, Math.min(2000, Math.round(n) || 1)); render(); };
  $("minus").onclick = () => setGuests(S.guests - (S.guests > 20 ? 5 : 1));
  $("plus").onclick = () => setGuests(S.guests + (S.guests >= 20 ? 5 : 1));
  $("guests").onchange = (e) => setGuests(+e.target.value);
  $("eventName").oninput = (e) => { S.event = e.target.value; save(); };
  $("search").oninput = renderDishes;

  document.addEventListener("click", (e) => {
    const t = e.target;
    if (t.dataset.cat) { catFilter = t.dataset.cat; renderDishes(); }
    else if (t.dataset.undish) { S.dishes = S.dishes.filter(x => x !== t.dataset.undish); render(); }
    else if (t.dataset.resetq) { const ed = S.edits[t.dataset.resetq]; if (ed) delete ed.qty; render(); }
    else if (t.dataset.resetp) { const ed = S.edits[t.dataset.resetp]; if (ed) delete ed.price; render(); }
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    const ed = (k) => (S.edits[k] ||= {});
    const val = (v) => { const n = parseFloat(String(v).replace(/\s/g, "").replace(",", ".")); return isFinite(n) && n >= 0 ? n : null; };
    if (t.dataset.dish) {
      S.dishes = t.checked ? [...S.dishes, t.dataset.dish] : S.dishes.filter(x => x !== t.dataset.dish);
      render();
    } else if (t.dataset.off) { ed(t.dataset.off).off = !t.checked; render(); }
    else if (t.dataset.qty) { const v = val(t.value); if (v != null) ed(t.dataset.qty).qty = v; render(); }
    else if (t.dataset.price) { const v = val(t.value); if (v != null) ed(t.dataset.price).price = v; render(); }
    else if (t.dataset.addsel) {
      const sec = t.dataset.addsel, k = t.value;
      if (k === "__custom") {
        const name = prompt("Название позиции:");
        if (name) {
          const unit = prompt("Единица (кг, л, шт, пачка…):", "шт") || "шт";
          const qty = parseFloat((prompt("Количество:", "1") || "1").replace(",", ".")) || 1;
          const price = parseFloat((prompt("Цена за единицу, ₸:", "0") || "0").replace(",", ".")) || 0;
          S.extra.push({ id: "x" + Date.now(), name, unit, section: sec, qty, price });
        }
      } else if (k) {
        ed(k).off = false;
        S.extraKeys = [...new Set([...(S.extraKeys || []), k])];
      }
      render();
    }
  });

  // ── экспорт ──
  function payload() {
    const rows = computeRows().filter(r => !r.off && r.qty > 0);
    const sections = SECTIONS.map(s => {
      const rs = rows.filter(r => r.section === s.name).sort((a, b) => a.name.localeCompare(b.name, "ru"));
      return { name: s.name, tab: s.tab, total: Math.round(rs.reduce((t, r) => t + r.sum, 0)),
               rows: rs.map(r => ({ name: r.name, qty: fmtQty(r.qty), unit: r.unit, price: Math.round(r.price), sum: Math.round(r.sum) })) };
    }).filter(s => s.rows.length);
    const total = sections.reduce((t, s) => t + s.total, 0);
    const date = new Date().toLocaleDateString("ru-RU");
    return { title: (S.event || "Воскресный пир") + " — закуп на " + S.guests + " гостей", date, guests: S.guests,
             cook: S.cook || "", dishes: S.dishes.map(id => byId[id].name), sections, total };
  }

  function showDoc(html) { $("docMsg").innerHTML = html; $("docDialog").showModal(); }

  $("docsBtn").onclick = async () => {
    const url = S.webapp || CFG.DOCS_WEBAPP_URL;
    const p = payload();
    if (!p.sections.length) { toast("Список пуст — выберите блюда"); return; }
    if (!url) {
      showDoc(`<p>Скрипт Google Docs ещё не подключён. Его нужно один раз установить в Google-аккаунте
        (инструкция — <a href="https://github.com/Kassymov-Samat/sunday-feast/tree/main/apps-script" target="_blank" rel="noopener">apps-script/README.md</a>)
        и вставить адрес в ⚙ Настройки.</p><p>Пока можно нажать «Скопировать для Docs» и вставить в новый документ.</p>`);
      return;
    }
    const b = $("docsBtn"); b.disabled = true; b.textContent = "Создаю документ…";
    try {
      const res = await fetch(url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(p) });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "ошибка скрипта");
      window.open(data.url, "_blank");
      showDoc(`<p>Документ создан — вкладки: Сводка, Молочка, Бакалея, Овощи и фрукты, Остальное.</p>
        <a class="doclink" href="${esc(data.url)}" target="_blank" rel="noopener">${esc(data.url)}</a>`);
    } catch (err) {
      showDoc(`<p>Не удалось создать документ: ${esc(err.message)}</p><p class="hint">Проверьте адрес скрипта в ⚙ Настройках или воспользуйтесь «Скопировать для Docs».</p>`);
    } finally { b.disabled = false; b.textContent = "📄 Отправить в Google Docs"; }
  };

  $("copyDocBtn").onclick = async () => {
    const p = payload();
    if (!p.sections.length) { toast("Список пуст — выберите блюда"); return; }
    const tbl = (s) => `<h2>${esc(s.name)}</h2><table border="1" cellpadding="4" style="border-collapse:collapse">
      <tr><th>✓</th><th>Наименование</th><th>Кол-во</th><th>Ед.</th><th>Цена</th><th>Сумма</th></tr>
      ${s.rows.map(r => `<tr><td>☐</td><td>${esc(r.name)}</td><td>${esc(r.qty)}</td><td>${esc(r.unit)}</td><td>${money(r.price)}</td><td>${money(r.sum)}</td></tr>`).join("")}
      <tr><td></td><td><b>Итого</b></td><td></td><td></td><td></td><td><b>${money(s.total)}</b></td></tr></table>`;
    const html = `<h1>${esc(p.title)}</h1><p>Дата: ${p.date} · Гостей: ${p.guests}</p><p><b>Меню:</b> ${esc(p.dishes.join(", "))}</p>`
      + p.sections.map(tbl).join("") + `<p><b>ИТОГО: ${money(p.total)}</b></p>`;
    const text = html.replace(/<[^>]+>/g, " ");
    try {
      await navigator.clipboard.write([new ClipboardItem({ "text/html": new Blob([html], { type: "text/html" }), "text/plain": new Blob([text], { type: "text/plain" }) })]);
      window.open("https://docs.new", "_blank");
      toast("Скопировано — вставьте в новый документ (Ctrl+V)");
    } catch (e) { toast("Браузер не дал доступ к буферу обмена"); }
  };

  $("copyTextBtn").onclick = async () => {
    const p = payload();
    const t = `${p.title}\nМеню: ${p.dishes.join(", ")}\n\n` + p.sections.map(s =>
      `${s.name}:\n` + s.rows.map(r => `• ${r.name} — ${r.qty} ${r.unit}`).join("\n")).join("\n\n") + `\n\nИтого: ${money(p.total)}`;
    try { await navigator.clipboard.writeText(t); toast("Список скопирован"); } catch (e) { toast("Не удалось скопировать"); }
  };
  $("printBtn").onclick = () => window.print();
  $("resetBtn").onclick = () => {
    if (!confirm("Сбросить блюда, правки количества и цен?")) return;
    const keep = { webapp: S.webapp, cook: S.cook }; S = Object.assign(fresh(), keep); history.replaceState(null, "", location.pathname); render();
  };
  $("settingsBtn").onclick = () => { $("webappUrl").value = S.webapp || CFG.DOCS_WEBAPP_URL || ""; $("cookName").value = S.cook || ""; $("settings").showModal(); };
  $("settingsCancel").onclick = () => $("settings").close();
  $("settingsSave").onclick = () => { S.webapp = $("webappUrl").value.trim(); S.cook = $("cookName").value.trim(); save(); $("settings").close(); toast("Сохранено"); };
  $("docClose").onclick = () => $("docDialog").close();

  render();
})();
</script>
</body>
</html>
